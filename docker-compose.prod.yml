version: '3.8'

services:
  backend:
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - EVENTGO_MAIN_TABLE=${EVENTGO_MAIN_TABLE}
      - EVENTGO_DEFAULT_TENANT_ID=${EVENTGO_DEFAULT_TENANT_ID}
      - EVENTGO_DUAL_WRITE=${EVENTGO_DUAL_WRITE}
      - ENABLE_LEGACY_FALLBACK=${ENABLE_LEGACY_FALLBACK}
      - LEGACY_FALLBACK_DISABLED_TENANTS=${LEGACY_FALLBACK_DISABLED_TENANTS}
      - ASSET_ROOT=${ASSET_ROOT}
      - FRONTEND_BUILD_ROOT=${FRONTEND_BUILD_ROOT}
      - ENFORCE_ASSET_GUARDRAILS=${ENFORCE_ASSET_GUARDRAILS:-true}
    volumes:
      - /var/www/frontend:/var/www/frontend:ro
      - /var/www/assets:/var/www/assets:ro
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    env_file:
      - .env.docker
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx-proxy:
    image: nginx:alpine
    container_name: eventgo-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.proxy.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - /var/www/frontend:/var/www/frontend:ro
      - /var/www/assets:/var/www/assets:ro
    depends_on:
      - backend
      - frontend
    networks:
      - eventgo
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    profiles:
      - production
