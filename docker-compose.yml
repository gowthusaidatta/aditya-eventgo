version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventgo-backend
    ports:
      - "5000:5000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5000}
      - AWS_REGION=${AWS_REGION}
      - EVENTGO_MAIN_TABLE=${EVENTGO_MAIN_TABLE}
      - EVENTGO_DEFAULT_TENANT_ID=${EVENTGO_DEFAULT_TENANT_ID}
      - EVENTGO_DUAL_WRITE=${EVENTGO_DUAL_WRITE}
      - ENABLE_LEGACY_FALLBACK=${ENABLE_LEGACY_FALLBACK}
      - LEGACY_FALLBACK_DISABLED_TENANTS=${LEGACY_FALLBACK_DISABLED_TENANTS}
      - EVENTS_TABLE=${EVENTS_TABLE}
      - USERS_TABLE=${USERS_TABLE}
      - OPPORTUNITIES_TABLE=${OPPORTUNITIES_TABLE}
      - REGISTRATIONS_TABLE=${REGISTRATIONS_TABLE}
      - TEAMS_TABLE=${TEAMS_TABLE}
      - TEAM_MEMBERS_TABLE=${TEAM_MEMBERS_TABLE}
      - ROLES_TABLE=${ROLES_TABLE}
      - USER_ROLES_TABLE=${USER_ROLES_TABLE}
      - SCHEDULES_TABLE=${SCHEDULES_TABLE}
      - SUBMISSIONS_TABLE=${SUBMISSIONS_TABLE}
      - JUDGING_SCORES_TABLE=${JUDGING_SCORES_TABLE}
      - JUDGING_RUBRICS_TABLE=${JUDGING_RUBRICS_TABLE}
      - NOTIFICATIONS_TABLE=${NOTIFICATIONS_TABLE}
      - CERTIFICATES_TABLE=${CERTIFICATES_TABLE}
      - EVENT_PERMISSIONS_TABLE=${EVENT_PERMISSIONS_TABLE}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET}
      - COGNITO_REGION=${COGNITO_REGION}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DYNAMODB_ENDPOINT=${DYNAMODB_ENDPOINT}
      - ASSET_ROOT=${ASSET_ROOT}
      - FRONTEND_BUILD_ROOT=${FRONTEND_BUILD_ROOT}
      - ENFORCE_ASSET_GUARDRAILS=${ENFORCE_ASSET_GUARDRAILS:-false}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - eventgo
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode); }).on('error', (e) => { throw e; });"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_URL: ${VITE_APP_URL}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
        VITE_COGNITO_REGION: ${VITE_COGNITO_REGION}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN}
        VITE_COGNITO_REDIRECT_URI: ${VITE_COGNITO_REDIRECT_URI}
        VITE_COGNITO_LOGOUT_URI: ${VITE_COGNITO_LOGOUT_URI}
    container_name: eventgo-frontend
    ports:
      - "3000:80"
    env_file:
      - .env.docker
    depends_on:
      - backend
    networks:
      - eventgo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: eventgo-dynamodb
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - eventgo
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    profiles:
      - local-db
    restart: unless-stopped

networks:
  eventgo:
    driver: bridge

volumes:
  dynamodb-data:
    driver: local
